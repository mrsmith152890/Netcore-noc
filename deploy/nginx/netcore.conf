server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/netcore/netcore.crt;
    ssl_certificate_key /etc/ssl/netcore/netcore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    include snippets/netcore-security.conf;

    root /var/www/netcore;
    index index.html;

    location = /api/v1/auth/login {
        limit_req zone=netcore_login burst=5 nodelay;
        include snippets/netcore-proxy.conf;
    }

    location /api/ {
        client_max_body_size 1m;
        include snippets/netcore-proxy.conf;
    }

    location /assets/ {
        include snippets/netcore-security.conf;     # add_header de un location reemplaza a los del server
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    location / {
        include snippets/netcore-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
